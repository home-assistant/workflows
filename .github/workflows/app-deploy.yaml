name: App deploy

on:
  workflow_call:
    inputs:
      path:
        description: App directory, detected from the only config.yaml one level deep if empty
        required: false
        type: string
        default: ""
      repository:
        description: Name of the stable app index repository in the same organization
        required: false
        type: string
        default: apps
      repository_beta:
        description: Name of the beta catalog repository, beta releases are not announced if empty
        required: false
        type: string
        default: ""
      repository_edge:
        description: Name of the edge catalog repository, edge builds are not announced if empty
        required: false
        type: string
        default: ""
    secrets:
      DISPATCH_TOKEN:
        description: Token allowed to send repository_dispatch events to the catalog repositories
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-deploy

env:
  # Any workflow in this repository matches this identity, so pair it with a check of the calling repository
  SIGNER_IDENTITY: ^https://github\.com/home-assistant/workflows/
  BASE_IMAGE_IDENTITY: ^https://github\.com/home-assistant/docker-base/\.github/workflows/build-base-image\.yml@refs/tags/[0-9]+\.[0-9]+\.[0-9]+$

jobs:
  information:
    name: Gather app information
    # Run only for home-assistant repositories because any public repository can call this workflow
    if: github.repository_owner == 'home-assistant'
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      base_image: ${{ steps.base.outputs.image }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      description: ${{ steps.normalize.outputs.description }}
      environment: ${{ steps.release.outputs.environment }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      image_tag: ${{ steps.release.outputs.environment == 'edge' && 'dev' || steps.release.outputs.environment }}
      name: ${{ steps.normalize.outputs.name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      target: ${{ steps.target.outputs.target }}
      url: ${{ steps.normalize.outputs.url }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find app directory
        id: target
        env:
          INPUT_PATH: ${{ inputs.path }}
        run: |
          target="${INPUT_PATH%/}"
          if [[ -z "${target}" ]]; then
            mapfile -t targets < <(find . -mindepth 2 -maxdepth 2 -name config.yaml -printf '%h\n')
            if [[ ${#targets[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one app directory, found: ${targets[*]}"
              exit 1
            fi
            target="${targets[0]#./}"
          fi
          echo "target=${target}" >> "$GITHUB_OUTPUT"

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master
        with:
          path: ./${{ steps.target.outputs.target }}

      - name: Normalize app information
        id: normalize
        env:
          IMAGE: ${{ fromJSON(steps.info.outputs.image) }}
          NAME: ${{ fromJSON(steps.info.outputs.name) }}
          DESCRIPTION: ${{ fromJSON(steps.info.outputs.description) }}
          URL: ${{ fromJSON(steps.info.outputs.url) }}
        run: |
          if [[ -z "${IMAGE}" || "${IMAGE}" == *"{arch}"* ]]; then
            echo "::error::Config option 'image' must be set to a generic image name without '{arch}'"
            exit 1
          fi
          {
            echo "image_name=${IMAGE##*/}"
            echo "registry_prefix=${IMAGE%/*}"
            echo "name=${NAME}"
            echo "description=${DESCRIPTION//$'\n'/ }"
            echo "url=${URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Find signed base image
        id: base
        env:
          DOCKERFILE: ./${{ steps.target.outputs.target }}/Dockerfile
        run: |
          base=$(sed -n 's/^ARG BUILD_FROM="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "${DOCKERFILE}" | head -n 1)
          # Only images built from home-assistant/docker-base have a known signer
          if [[ "${base}" =~ ^ghcr\.io/home-assistant/(base|base-python|base-debian|base-ubuntu)(:|@) ]]; then
            echo "image=${base}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Base image '${base}' is not verified with Cosign"
          fi

      - name: Gather version and environment
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          SHA: ${{ github.sha }}
        run: |
          environment="edge"
          version="${SHA:0:7}"
          if [[ "${EVENT_NAME}" == "release" ]]; then
            version="${TAG_NAME}"
            version="${version#v}"
            environment="stable"
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              environment="beta"
            fi
          fi
          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: information
    if: github.repository_owner == 'home-assistant'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Issue OIDC token for Cosign signing
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.information.outputs.build_matrix) }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./${{ needs.information.outputs.target }}
          cache-image-tag: dev
          cosign-identity: ${{ env.SIGNER_IDENTITY }}
          cosign-base-verify: ${{ needs.information.outputs.base_image }}
          cosign-base-identity: ${{ env.BASE_IMAGE_IDENTITY }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.information.outputs.version }}
            ${{ needs.information.outputs.image_tag }}
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.information.outputs.name }}
            io.hass.description=${{ needs.information.outputs.description }}
            ${{ needs.information.outputs.url && format('io.hass.url={0}', needs.information.outputs.url) || '' }}
          push: "true"
          version: ${{ needs.information.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs:
      - information
      - build
    if: github.repository_owner == 'home-assistant'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Issue OIDC token for Cosign signing
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ needs.information.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.information.outputs.image_name }}
          image-tags: |
            ${{ needs.information.outputs.version }}
            ${{ needs.information.outputs.image_tag }}
          registry-prefix: ${{ needs.information.outputs.registry_prefix }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify manifest signature
        env:
          IMAGE_REF: ${{ needs.information.outputs.registry_prefix }}/${{ needs.information.outputs.image_name }}:${{ needs.information.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Check the repository claim because the SAN only names this workflow
          for i in {1..5}; do
            if cosign verify \
              --certificate-identity-regexp "${SIGNER_IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository "${REPOSITORY}" \
              "${IMAGE_REF}"; then
              exit 0
            fi
            echo "Verification attempt ${i} failed, retrying..."
            sleep $((2 ** i))
          done
          echo "::error::Image verification failed for ${IMAGE_REF}"
          exit 1

  publish-edge:
    name: Publish to edge repository
    if: github.repository_owner == 'home-assistant' && needs.information.outputs.environment == 'edge' && inputs.repository_edge != ''
    needs:
      - information
      - manifest
    environment:
      name: edge
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repository updater update signal
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/${{ inputs.repository_edge }}
          event-type: update
          client-payload: >
            {
              "app": ${{ toJSON(github.repository) }},
              "name": ${{ toJSON(needs.information.outputs.name) }},
              "repository": ${{ toJSON(github.repository) }},
              "version": ${{ toJSON(needs.information.outputs.version) }}
            }

  publish-beta:
    name: Publish to beta repository
    if: |
      github.repository_owner == 'home-assistant' && inputs.repository_beta != '' && (
        needs.information.outputs.environment == 'beta' ||
        needs.information.outputs.environment == 'stable'
      )
    needs:
      - information
      - manifest
    environment:
      name: beta
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repository updater update signal
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/${{ inputs.repository_beta }}
          event-type: update
          client-payload: >
            {
              "app": ${{ toJSON(github.repository) }},
              "name": ${{ toJSON(needs.information.outputs.name) }},
              "repository": ${{ toJSON(github.repository) }},
              "version": ${{ toJSON(github.event.release.tag_name) }}
            }

  publish-stable:
    name: Publish to stable repository
    if: github.repository_owner == 'home-assistant' && needs.information.outputs.environment == 'stable'
    needs:
      - information
      - manifest
    environment:
      name: stable
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repository updater update signal
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/${{ inputs.repository }}
          event-type: update
          client-payload: >
            {
              "app": ${{ toJSON(github.repository) }},
              "name": ${{ toJSON(needs.information.outputs.name) }},
              "repository": ${{ toJSON(github.repository) }},
              "version": ${{ toJSON(github.event.release.tag_name) }}
            }
